name: duck — ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'duck/**'
      - '.github/workflows/duck-ci.yml'
  push:
    branches: [main]
    paths:
      - 'duck/**'
      - '.github/workflows/duck-ci.yml'

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: duck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run lint
