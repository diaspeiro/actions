name: duck — ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'duck/**'
      - '.github/workflows/duck-ci.yml'
  push:
    branches: [main]
    paths:
      - 'duck/**'
      - '.github/workflows/duck-ci.yml'

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: duck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run lint
