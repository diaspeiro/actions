name: duck — ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'duck/**'
      - '.github/workflows/duck-ci.yml'
  push:
    branches: [main]
    paths:
      - 'duck/**'
      - '.github/workflows/duck-ci.yml'

concurrency:
  group: duck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run lint
